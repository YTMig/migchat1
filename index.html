<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Chat P2P</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, sans-serif; background: #e5ddd5; height: 100vh; display: flex; flex-direction: column; }

  /* Login */
  #login { margin: auto; background: #fff; padding: 24px; border-radius: 10px; width: min(90vw, 360px); display: flex; flex-direction: column; gap: 10px; }
  #login h2 { margin: 0 0 8px; color: #075e54; }
  input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
  .primary { background: #075e54; color: #fff; border: none; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-size: 16px; }

  /* App */
  #app { flex: 1; display: none; flex-direction: column; min-height: 0; }
  header { background: #075e54; color: #fff; padding: 10px 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  header button { background: #128c7e; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
  #status { font-size: 12px; opacity: .85; width: 100%; }
  #msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 75%; padding: 6px 10px; border-radius: 8px; background: #fff; word-wrap: break-word; align-self: flex-start; }
  .msg.me { align-self: flex-end; background: #dcf8c6; }
  .msg small { display: block; color: #666; font-size: 11px; margin-bottom: 2px; }
  #sendForm { display: flex; gap: 8px; padding: 8px; background: #f0f0f0; }
  #sendForm input { flex: 1; border-radius: 20px; }

  /* Chamada */
  #callView { display: none; position: fixed; inset: 0; background: #111; color: #fff; flex-direction: column; z-index: 10; }
  .callBar { display: flex; gap: 8px; align-items: center; padding: 10px; background: #202020; flex-wrap: wrap; }
  .callBar #callInfo { flex: 1; font-size: 13px; word-break: break-all; }
  .callBar button { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; color: #fff; background: #444; }
  #videos { flex: 1; display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; align-content: flex-start; overflow-y: auto; }
  .tile { position: relative; width: min(100%, 420px); background: #000; border-radius: 8px; overflow: hidden; }
  .tile video { width: 100%; display: block; }
  .tile span { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.5); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
</style>
</head>
<body>

<div id="login">
  <h2>Meu Chat P2P</h2>
  <input id="inName" placeholder="Seu nome">
  <input id="inRoom" placeholder="Nome da sala (ex: amigos)">
  <input id="inPass" type="password" placeholder="Senha da sala (todos usam a mesma)">
  <button class="primary" id="btnLogin">Entrar</button>
</div>

<div id="app">
  <header>
    <h1 id="title"></h1>
    <span id="status">Conectando...</span>
    <button id="btnCall">📹 Chamada</button>
    <button id="btnExport">💾 Exportar</button>
  </header>
  <div id="msgs"></div>
  <form id="sendForm">
    <input id="inText" placeholder="Digite uma mensagem" autocomplete="off">
    <button class="primary" type="submit">Enviar</button>
  </form>
</div>

<div id="callView">
  <div class="callBar">
    <span id="callInfo"></span>
    <button id="btnCopy">🔗 Copiar link</button>
    <button id="btnMic">🎤 Mudo</button>
    <button id="btnCam">🎥 Câmera</button>
    <button id="btnLeave" style="background:#c62828">Sair</button>
  </div>
  <div id="videos"></div>
</div>

<script type="module">
import { joinRoom } from 'https://esm.sh/trystero/torrent';

const $ = id => document.getElementById(id);
const APP_ID = 'meu-chat-p2p-v1';
const uid = crypto.randomUUID();
const STORAGE_PREFIX = 'chat:';

let myName = '', roomName = '', password = '';
let history = [];
let chatRoom = null, sendMsg = null, sendSync = null;
let callRoom = null, localStream = null, callId = null;

// ---------- Utilidades ----------
function config() {
  return password ? { appId: APP_ID, password } : { appId: APP_ID };
}

function slug(s) {
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'sala';
}

function linkDaChamada(id) {
  return `${location.origin}${location.pathname}#call=${id}`;
}

function newCallId() {
  return slug(roomName) + '-' + crypto.randomUUID().slice(0, 6);
}

// ---------- Login ----------
$('btnLogin').onclick = () => {
  myName = $('inName').value.trim() || 'Anônimo';
  roomName = $('inRoom').value.trim() || 'geral';
  password = $('inPass').value;

  $('login').style.display = 'none';
  $('app').style.display = 'flex';
  $('title').textContent = '# ' + roomName;

  history = JSON.parse(localStorage.getItem(STORAGE_PREFIX + roomName) || '[]');
  history.forEach(render);
  openChat();

  // Se o link veio com #call=..., entra na chamada automaticamente
  const m = location.hash.match(/call=([a-z0-9-]+)/);
  if (m) startCall(m[1]);
};

// ---------- Chat P2P ----------
function openChat() {
  chatRoom = joinRoom(config(), 'chat-' + slug(roomName));
  const [send1, getMsg] = chatRoom.makeAction('msg');
  const [send2, getSync] = chatRoom.makeAction('sync');
  sendMsg = send1;
  sendSync = send2;

  getMsg(m => addMessage(m));
  getSync(msgs => msgs.forEach(addMessage));

  // Quem entra recebe o histórico dos online
  chatRoom.onPeerJoin(peerId => {
    updateStatus();
    sendSync(history, peerId);
  });
  chatRoom.onPeerLeave(() => updateStatus());

  $('status').textContent = 'Aguardando amigos...';
}

function updateStatus() {
  const n = Object.keys(chatRoom.getPeers()).length;
  $('status').textContent = n ? `Online: ${n}` : 'Aguardando amigos...';
}

function render(m) {
  const d = document.createElement('div');
  d.className = 'msg' + (m.uid === uid ? ' me' : '');
  const n = document.createElement('small');
  n.textContent = m.name + ' · ' + new Date(m.time).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  const t = document.createElement('div');
  t.textContent = m.text;
  d.append(n, t);
  $('msgs').appendChild(d);
  $('msgs').scrollTop = 1e9;
}

function addMessage(m) {
  if (history.some(h => h.id === m.id)) return;
  history.push(m);
  localStorage.setItem(STORAGE_PREFIX + roomName, JSON.stringify(history));
  render(m);
}

$('sendForm').onsubmit = e => {
  e.preventDefault();
  const text = $('inText').value.trim();
  if (!text || !sendMsg) return;
  $('inText').value = '';
  const m = { id: uid + '-' + Date.now(), uid, name: myName, text, time: Date.now() };
  addMessage(m);
  sendMsg(m);
};

$('btnExport').onclick = () => {
  const txt = history.map(m => `[${new Date(m.time).toLocaleString('pt-BR')}] ${m.name}: ${m.text}`).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain' }));
  a.download = `chat-${slug(roomName)}.txt`;
  a.click();
};

// ---------- Chamada P2P com link fixo ----------
$('btnCall').onclick = () => {
  if (callRoom) { $('callView').style.display = 'flex'; return; }
  startCall(newCallId());
};

async function startCall(id) {
  if (callRoom) return;
  if (!navigator.mediaDevices) {
    alert('Câmera e microfone só funcionam em HTTPS. Abra pelo GitHub Pages.');
    return;
  }
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  } catch (err) {
    alert('Sem acesso à câmera/microfone: ' + err.message);
    return;
  }

  callId = id;
  const link = linkDaChamada(id);
  $('callView').style.display = 'flex';
  $('callInfo').textContent = 'Link: ' + link;
  addTile('me', 'Você', localStream, true);

  callRoom = joinRoom(config(), 'call-' + id);
  callRoom.addStream(localStream);
  callRoom.onPeerStream((stream, peerId) => addTile(peerId, 'Amigo', stream));
  callRoom.onPeerLeave(peerId => removeTile(peerId));

  // Posta o link no chat para os amigos online
  const m = { id: uid + '-' + Date.now(), uid, name: myName, text: '📹 Chamada: ' + link, time: Date.now() };
  addMessage(m);
  sendMsg?.(m);
}

function addTile(key, label, stream, muted = false) {
  let box = document.getElementById('t-' + key);
  if (!box) {
    box = document.createElement('div');
    box.id = 't-' + key;
    box.className = 'tile';
    const v = document.createElement('video');
    v.autoplay = true; v.playsInline = true; v.muted = muted;
    const l = document.createElement('span');
    l.textContent = label;
    box.append(v, l);
    $('videos').appendChild(box);
  }
  box.querySelector('video').srcObject = stream;
}

function removeTile(key) {
  document.getElementById('t-' + key)?.remove();
}

$('btnCopy').onclick = async () => {
  const link = linkDaChamada(callId || slug(roomName));
  try {
    await navigator.clipboard.writeText(link);
    alert('Link copiado! Quem abrir precisa do mesmo nome de sala e senha.');
  } catch {
    prompt('Copie o link:', link);
  }
};

$('btnMic').onclick = () => {
  if (!localStream) return;
  const t = localStream.getAudioTracks()[0];
  if (!t) return;
  t.enabled = !t.enabled;
  $('btnMic').textContent = t.enabled ? '🎤 Mudo' : '🔇 Ativar mic';
};

$('btnCam').onclick = () => {
  if (!localStream) return;
  const t = localStream.getVideoTracks()[0];
  if (!t) return;
  t.enabled = !t.enabled;
  $('btnCam').textContent = t.enabled ? '🎥 Câmera' : '🚫 Ligar câmera';
};

$('btnLeave').onclick = () => {
  if (callRoom) { callRoom.leave(); callRoom = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  callId = null;
  $('videos').innerHTML = '';
  $('callView').style.display = 'none';
  $('btnMic').textContent = '🎤 Mudo';
  $('btnCam').textContent = '🎥 Câmera';
  window.history.replaceState(null, '', location.pathname);
};
</script>
</body>
</html>
